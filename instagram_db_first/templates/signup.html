{% extends "base.html" %}
{% block title %}회원가입 · DB Photo Lab{% endblock %}
{% block content %}
<section class="panel narrow"><h1>회원가입</h1>
  <p class="muted">users 테이블에 계정을 추가합니다.</p>
  <form method="post" action="/signup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>아이디 (영문·숫자·_, 3~32자)<input name="user_id" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+"></label>
    <label>표시 이름<input name="display_name" required maxlength="60"></label>
    <label>비밀번호 (8자 이상)<input name="password" type="password" minlength="8" required></label>
    <button type="submit">가입하기</button>
  </form>
  <p>이미 계정이 있나요? <a href="/login">로그인</a></p>
</section>
{% endblock %}
