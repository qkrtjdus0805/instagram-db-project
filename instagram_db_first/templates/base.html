<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DB Photo Lab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="/">DB Photo Lab</a>
      {% if current_user %}
        <nav>
          <a href="/feed">홈 피드</a>
          <a href="/users">사용자</a>
          <a href="/posts/new">사진 올리기</a>
          <a href="/users/{{ current_user|urlencode }}">내 프로필</a>
          <a href="/settings">비밀번호</a>
          <form class="inline" method="post" action="/logout">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button type="submit" class="text-button">로그아웃</button>
          </form>
        </nav>
      {% else %}
        <nav><a href="/login">로그인</a><a href="/signup">회원가입</a></nav>
      {% endif %}
    </div>
  </header>
  <main>
    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
    {% if message %}<div class="alert good">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>Gachon University · Database Term Project · DB-first implementation</footer>
</body>
</html>
