{% extends "base.html" %}
{% block title %}사진 업로드 · DB Photo Lab{% endblock %}
{% block content %}
<section class="panel narrow"><h1>새 게시물</h1>
  <p class="muted">이미지 파일은 로컬 uploads 폴더에, 파일 경로와 설명은 posts 테이블에 저장합니다.</p>
  <form method="post" action="/posts" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>사진 (JPG/PNG/WEBP, 5MB 이하)<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label>
    <label>설명<textarea name="caption" maxlength="500" rows="4" placeholder="사진 설명"></textarea></label>
    <button type="submit">게시하기</button>
  </form>
</section>
{% endblock %}
