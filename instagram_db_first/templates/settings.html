{% extends "base.html" %}
{% block title %}비밀번호 변경 · DB Photo Lab{% endblock %}
{% block content %}
<section class="panel narrow"><h1>비밀번호 변경</h1>
  <p class="muted">변경된 비밀번호의 해시만 users 테이블에 저장합니다.</p>
  <form method="post" action="/settings/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>기존 비밀번호<input type="password" name="old_password" required></label>
    <label>새 비밀번호 (8자 이상)<input type="password" name="new_password" minlength="8" required></label>
    <button type="submit">변경</button>
  </form>
</section>
{% endblock %}
